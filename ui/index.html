<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifold</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; padding: 1.4rem 1.2rem 2.5rem; max-width: 1140px;
         margin-inline: auto; background: Canvas; color: CanvasText; }
  header { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
  h1 { font-size: 1.55rem; margin: 0; letter-spacing: -.01em; }
  .muted { opacity: .6; font-size: .85rem; }
  #members { display: flex; gap: .4rem; flex-wrap: wrap; margin-block: .6rem; }
  .chip { border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
          border-radius: 999px; padding: .1rem .6rem; font-size: .85rem; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .full { grid-column: 1 / -1; }
  #deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
          gap: .8rem; }
  .card { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
          border-radius: 10px; padding: .7rem .8rem; }
  .card h3 { margin: 0 0 .35rem; font-size: .8rem; opacity: .6;
             text-transform: uppercase; letter-spacing: .05em; }
  .metric { font-size: 1.7rem; font-weight: 650; line-height: 1.1; }
  .metric-label { font-size: .8rem; opacity: .6; }
  .card p { margin: .3rem 0 0; font-size: .88rem; }
  .card.wide { grid-column: span 2; }
  .card.full { grid-column: 1 / -1; }
  .card.compact .metric { font-size: 1.35rem; }
  @media (max-width: 560px) { .card.wide, .card.full { grid-column: span 1; } }
  .as-of { font-size: .72rem; opacity: .5; margin-top: .45rem; }
  .as-of.stale { color: #c98a2b; opacity: .9; }
  .card.pinned { border-color: color-mix(in srgb, CanvasText 45%, transparent); }
  .chart svg { width: 100%; height: auto; display: block; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  section { border: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
            border-radius: 12px; padding: .9rem 1rem;
            background: color-mix(in srgb, CanvasText 2.5%, Canvas); }
  .card { background: Canvas; }
  #askdesk { margin-top: 1rem;
             border-color: color-mix(in srgb, #4f8ef7 45%, transparent); }
  button.primary { border-color: #4f8ef7; color: #4f8ef7; font-weight: 600;
                   white-space: nowrap; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
       opacity: .6; margin: 0 0 .6rem; }
  #framing { white-space: pre-wrap; font-size: .9rem; opacity: .85; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td { padding: .25rem .4rem; vertical-align: top; border-top: 1px solid
       color-mix(in srgb, CanvasText 10%, transparent); }
  td.key { font-weight: 600; white-space: nowrap; }
  td.val { font-family: ui-monospace, monospace; font-size: .82rem; word-break: break-all; }
  #feed { display: flex; flex-direction: column; gap: .45rem; max-height: 55vh;
          overflow-y: auto; }
  .msg b { margin-right: .35rem; }
  .task { border-left: 3px solid color-mix(in srgb, CanvasText 40%, transparent);
          padding-left: .5rem; }
  form { display: flex; gap: .5rem; margin-top: .7rem; }
  input[type=text] { flex: 1; padding: .45rem .6rem; border-radius: 8px;
          border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
          background: transparent; color: inherit; }
  button { padding: .45rem .9rem; border-radius: 8px; border: 1px solid
           color-mix(in srgb, CanvasText 25%, transparent);
           background: transparent; color: inherit; cursor: pointer; }
  .hint { font-size: .75rem; opacity: .5; margin-top: .3rem; }
  #cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
           gap: .8rem; }
  .case-head { display: flex; justify-content: space-between;
               align-items: baseline; gap: .5rem; }
  .state { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
           border: 1px solid color-mix(in srgb, CanvasText 30%, transparent);
           border-radius: 999px; padding: .05rem .5rem; opacity: .8;
           white-space: nowrap; }
  .s-open-simulated { border-color: #4fb98a; color: #4fb98a; opacity: 1; }
  .s-closed { opacity: .55; }
  .invalidation { border-left: 3px solid #d96a6a; padding-left: .5rem;
                  opacity: .85; }
  .fill-line { font-family: ui-monospace, monospace; font-size: .8rem; }
  .violation { color: #d96a6a; font-size: .82rem; }
  .choices { display: flex; gap: .4rem; flex-wrap: wrap; margin: .3rem 0; }
  .choices button { font-size: .85rem; }
  .choices button.selected { border-color: #4f8ef7; color: #4f8ef7; }
  input[type=range] { flex: 1; accent-color: #4f8ef7; }
  .readout { font-family: ui-monospace, monospace; font-size: .9rem;
             min-width: 4.5rem; text-align: right; }
  #liveness { display: flex; gap: .9rem; flex-wrap: wrap; align-items: baseline;
              font-size: .8rem; margin: .1rem 0 .7rem; }
  #liveness .ok { color: #4fb98a; }
  #liveness .warn { color: #d96a6a; }
  #liveness .busy { color: #f2a43a; }
  .strip { display: flex; gap: .5rem; flex-wrap: wrap; }
  .tick { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
          border-radius: 8px; padding: .3rem .6rem; font-size: .85rem;
          font-family: ui-monospace, monospace; }
  .tick .up { color: #4fb98a; } .tick .down { color: #d96a6a; }
  .tick.broken { border-color: #d96a6a; color: #d96a6a; }
  pre.data-body { font-size: .72rem; max-height: 14rem; overflow: auto;
                  white-space: pre-wrap; word-break: break-word;
                  margin: .3rem 0 0; opacity: .85; }
  .finding { font-size: .88rem; margin: .35rem 0; }
  details.workings { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
                     border-radius: 10px; padding: .6rem .8rem; }
  details.workings summary { cursor: pointer; font-size: .8rem;
    text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  details.workings section { border: none; padding: .4rem 0; }
</style>

<header>
  <h1 id="title">…</h1>
  <span class="muted" id="version"></span>
  <span class="muted">market research desk · paper by structure</span>
</header>
<div id="members"></div>
<div id="liveness"></div>
<details><summary class="muted">What this place is for</summary>
  <p id="framing"></p></details>

<section id="intake" hidden>
  <h2>Set up this desk</h2>
  <form id="intake-form"></form>
  <p class="hint">Your answers seed the shared context; then the agent builds the desk.</p>
</section>

<main id="views"></main>

<section id="askdesk">
  <h2>Ask the desk</h2>
  <form id="composer">
    <input type="text" id="line" autocomplete="off"
           placeholder="Tell the desk what to do — “build a case on NVDA into earnings”, “chart SPX against its gamma pin”, “what changed today?”">
    <button class="primary">Send to the desk</button>
  </form>
  <p class="hint">The desk agent reads this, takes a turn, and updates the board.
     Raw plumbing (key=value, @member handoffs) lives in Workings.</p>
</section>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("token");
const envId = location.pathname.split("/").filter(Boolean)[1];
const headers = {"X-Manifold-Token": token, "Content-Type": "application/json"};

// Chart libraries ship with the harness; the service serves them per
// environment, token-authorized — so they load here, not via <script src>.
const assetsReady = ["d3.min.js", "d3-sankey.min.js"].reduce(
  (chain, name) => chain.then(() => new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = `/app/${envId}/ui/${name}?token=${token}`;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`${name} failed to load`));
    document.head.append(script);
  })), Promise.resolve());

async function api(method, path, body) {
  const response = await fetch(path, {method, headers,
    body: body ? JSON.stringify(body) : undefined});
  if (!response.ok) throw new Error((await response.json()).error || response.status);
  return response.json();
}

function el(tag, attrs = {}, text = "") {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (text) node.textContent = text;
  return node;
}

// The desk fetches its own standard data (EOD closes, daily bars) through
// the granted tools, cached by TTL — agents write facts, not wiring.
// The cached value is the promise itself, so concurrent callers share one call.
const toolCache = new Map();
function toolData(tool, args, ttlMinutes) {
  const cacheKey = tool + JSON.stringify(args);
  const hit = toolCache.get(cacheKey);
  if (hit && Date.now() - hit.at < ttlMinutes * 60000) return hit.value;
  const value = api("POST", `/environments/${envId}/tools/${tool}`, {args})
    .then(reply => reply.result)
    .catch(error => ({ok: false, summary: error.message, gaps: [error.message]}));
  toolCache.set(cacheKey, {at: Date.now(), value});
  return value;
}

let you = "";
let lastRendered = "";
let lastView = null;
let lastFetchAt = 0;
let prevContext = null;
let prevConversationLength = -1;
let turnActive = false;
let turnStarted = 0;
let lastChange = "";
let workingsOpen = false;

function contextDiff(previous, current) {
  const changed = [];
  const keys = new Set([
    ...Object.keys(previous || {}), ...Object.keys(current || {})]);
  for (const key of keys)
    if (JSON.stringify(previous?.[key]) !== JSON.stringify(current?.[key]))
      changed.push(key);
  return changed;
}

function render(view) {
  // Re-render only on real change: a quiet 5s poll must not wipe
  // hover state or half-built interactions.
  const fingerprint = JSON.stringify(view);
  if (fingerprint === lastRendered) return;
  lastRendered = fingerprint;
  lastView = view;
  you = view.you;

  // Turn awareness: the autopilot announces its builds at desk/autopilot;
  // a turn is over when the agent's writes (or its say) land.
  const autopilotTurn = view.context["desk/autopilot"]?.last_turn;
  if (prevContext !== null &&
      autopilotTurn !== prevContext["desk/autopilot"]?.last_turn) {
    turnActive = true;
    turnStarted = Date.now();
  }
  const changed = contextDiff(prevContext, view.context).filter(k =>
    !k.startsWith("desk/") && !k.startsWith("intake/") &&
    !k.startsWith("answers/") && !k.startsWith("~"));
  if (prevContext !== null && changed.length) {
    lastChange = `updated ${changed.slice(0, 4).join(", ")}` +
      (changed.length > 4 ? ` +${changed.length - 4} more` : "") +
      ` · ${new Date().toLocaleTimeString()}`;
    turnActive = false;
  }
  if (prevConversationLength >= 0 &&
      view.conversation.length > prevConversationLength)
    turnActive = false;
  prevContext = view.context;
  prevConversationLength = view.conversation.length;

  document.getElementById("title").textContent = view.harness.name;
  document.getElementById("version").textContent = view.harness.version;
  document.getElementById("framing").textContent = view.harness.framing || "";
  const members = document.getElementById("members");
  members.replaceChildren(...Object.entries(view.members).map(([key, name]) =>
    el("span", {class: "chip"}, name + (key === view.you ? " (you)" : ""))));

  renderIntake(view);
  updateLiveness();
  const container = document.getElementById("views");
  container.replaceChildren();
  for (const section of [
    renderWatchlist(view),
    renderPositions(view),
    Object.keys(view.context).some(k => k.startsWith("cases/"))
      ? renderCases(view) : null,
    renderWidgets(view),
    renderFindings(view),
    renderConversation(view),
    renderWorkings(view),
  ]) if (section) container.append(section);
}

function updateLiveness() {
  const bar = document.getElementById("liveness");
  if (!lastView) return;
  const parts = [];
  const age = lastFetchAt
    ? Math.max(0, Math.round((Date.now() - lastFetchAt) / 1000)) : null;
  parts.push(el("span", {class: age !== null && age < 30 ? "ok" : "warn"},
    age !== null ? `● desk synced ${age}s ago` : "● connecting…"));
  if (turnActive && Date.now() - turnStarted > 10 * 60000) turnActive = false;
  if (turnActive) {
    const minutes = Math.floor((Date.now() - turnStarted) / 60000);
    parts.push(el("span", {class: "busy"},
      `the agent is at the desk…${minutes ? ` (${minutes}m)` : ""}`));
  }
  const autopilot = lastView.context["desk/autopilot"];
  if (autopilot) parts.push(el("span", {},
    `autopilot: ${autopilot.reason || "on duty"} · ` +
    `turn ${autopilot.builds_today}/${autopilot.budget}`));
  const next = lastView.context["desk/next_check"];
  if (next) {
    const when = new Date(next);
    if (!isNaN(when)) parts.push(el("span", {},
      `next check ${when.toLocaleTimeString("en-US",
        {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"})} ET`));
  }
  const audit = lastView.context["desk/audit"];
  if (audit) parts.push(el("span", {class: audit.clean ? "ok" : "warn"},
    audit.clean
      ? `audit ✓ ${audit.cases_checked} case(s) clean`
      : `audit ⚠ ${Object.keys(audit.violations || {}).length} case(s) broken`));
  if (lastChange) parts.push(el("span", {class: "muted"}, lastChange));
  bar.replaceChildren(...parts);
}
setInterval(updateLiveness, 1000);

function watchSymbols(view) {
  let raw = view.context.watchlist ?? view.context["intake/watchlist"] ?? [];
  if (typeof raw === "string") raw = raw.split(/[,\s]+/);
  if (!Array.isArray(raw)) return [];
  return [...new Set(raw.map(s => String(s).trim().toUpperCase())
    .filter(s => /^[A-Z.^]{1,6}$/.test(s)))];
}

function renderWatchlist(view) {
  const quoted = Object.entries(view.context)
    .filter(([key, value]) => key.startsWith("quotes/") && value);
  const quotedSymbols = new Set(quoted.map(([key]) => key.slice(7).toUpperCase()));
  const symbols = watchSymbols(view).filter(s => !quotedSymbols.has(s));
  if (!symbols.length && !quoted.length) return null;
  const section = el("section", {class: "full"});
  section.append(el("h2", {}, "Watchlist"));
  const strip = el("div", {class: "strip"});
  for (const [key, entry] of quoted) {
    const symbol = key.slice(7).toUpperCase();
    // Agents park the receipt at the top level or under a nested field
    // ("into": "quote") — read both shapes.
    const quote = (typeof entry === "object" && (entry.quote || entry.value)) || entry;
    const body = typeof quote === "object"
      ? `${quote.last ?? quote.mark ?? quote.close ?? ""}` +
        (quote.bid != null && quote.ask != null ? ` ${quote.bid}×${quote.ask}` : "")
      : String(quote);
    const chip = el("div", {class: "tick"});
    chip.append(el("b", {}, symbol + " "),
      document.createTextNode(body.trim() || "awaiting first receipt"));
    const clock = quote?.observed_at || quote?.as_of || entry?.as_of;
    if (clock) chip.title = `receipted quote · as of ${clock}`;
    if (entry?.refresh_error) {
      chip.classList.add("broken");
      chip.title = `refresh failed: ${entry.refresh_error}`;
    }
    strip.append(chip);
  }
  for (const symbol of symbols) {
    const chip = el("div", {class: "tick"}, `${symbol} …`);
    strip.append(chip);
    toolData("price_summary", {symbol}, 10).then(receipt => {
      if (!receipt?.ok) {
        chip.textContent = `${symbol} — unavailable`;
        chip.title = (receipt?.gaps || []).join("; ");
        return;
      }
      const d = receipt.data;
      chip.replaceChildren(
        el("b", {}, symbol + " "),
        document.createTextNode(`${d.close_label} `),
        el("span", {class: d.change_1d_pct >= 0 ? "up" : "down"},
          `${d.change_1d_pct >= 0 ? "+" : ""}${d.change_1d_pct}%`));
      chip.title = `${receipt.summary} · as of ${receipt.as_of}`;
    });
  }
  return section.appendChild(strip), section;
}

function renderPositions(view) {
  const rows = Object.entries(view.context).filter(([key, c]) =>
    key.startsWith("cases/") && c &&
    (c.state === "open-simulated" || (c.state === "closed" && c.fill)));
  if (!rows.length) return null;
  const section = el("section", {class: "full"});
  section.append(el("h2", {}, "Positions — simulated, paper only"));
  const table = el("table");
  const head = el("tr");
  for (const column of ["contract", "state", "entry",
                        "exit / result", "underlying (EOD)", "wrong if"])
    head.append(el("td", {class: "key"}, column));
  table.append(head);
  for (const [key, c] of rows) {
    const line = el("tr");
    line.append(el("td", {}, c.contract || key.slice(6)));
    const stateCell = el("td");
    stateCell.append(el("span", {class: `state s-${c.state}`}, c.state));
    line.append(stateCell);
    const f = c.fill;
    line.append(el("td", {class: "val"}, f
      ? `${f.quantity} @ $${f.price} (${f.bid}×${f.ask}) · ` +
        String(f.observed_at).slice(0, 10)
      : "—"));
    let result = c.state === "open-simulated" ? "open" : "—";
    if (c.exit && f) {
      const diff = c.exit.price - f.price;
      const pct = f.price ? 100 * diff / f.price : 0;
      result = `$${c.exit.price} (${diff >= 0 ? "+" : ""}${diff.toFixed(2)}` +
        `/contract, ${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%)`;
    }
    line.append(el("td", {class: "val"}, result));
    const underlying = el("td", {class: "val"}, "—");
    const symbol = String(c.contract || "").split(/\s+/)[0];
    if (/^[A-Z.]{1,6}$/.test(symbol)) {
      underlying.textContent = "…";
      toolData("price_summary", {symbol}, 10).then(receipt => {
        if (!receipt?.ok) { underlying.textContent = "unavailable"; return; }
        underlying.textContent = `${symbol} ${receipt.data.close_label} ` +
          `(${receipt.data.change_1d_pct >= 0 ? "+" : ""}` +
          `${receipt.data.change_1d_pct}% 1d)`;
        underlying.title = `as of ${receipt.as_of} — EOD close, not a live mark`;
      });
    }
    line.append(underlying);
    line.append(el("td", {}, c.invalidation || "—"));
    table.append(line);
  }
  section.append(table);
  return section;
}

function renderFindings(view) {
  const items = Object.entries(view.context)
    .filter(([key, value]) => key.startsWith("findings/") && value);
  if (!items.length) return null;
  const section = el("section");
  section.append(el("h2", {}, "Findings"));
  for (const [key, f] of items) {
    const line = el("div", {class: "finding"});
    const text = typeof f === "object"
      ? (f.title || f.text || f.body || JSON.stringify(f)) : String(f);
    line.append(el("b", {}, key.slice(9) + " "));
    line.append(document.createTextNode(String(text).slice(0, 300)));
    const clock = f && typeof f === "object" && (f.as_of || f.source_time);
    if (clock) line.append(el("div", {class: "as-of"},
      `as of ${clock}${f.source ? " · " + f.source : ""}`));
    section.append(line);
  }
  return section;
}

function renderWorkings(view) {
  const drawer = el("details", {class: "full workings"});
  if (workingsOpen) drawer.setAttribute("open", "");
  drawer.append(el("summary", {}, "Workings — raw context & journal"));
  drawer.append(renderBoard(view));
  const journal = el("section", {class: "full"});
  journal.append(el("h2", {}, "Journal — everything, forever"));
  drawer.append(journal);
  const plumbing = el("form");
  const input = el("input", {type: "text",
    placeholder: "plumbing: key=value sets context · @Name text hands work · else says"});
  plumbing.append(input, el("button", {}, "Apply"));
  plumbing.addEventListener("submit", async event => {
    event.preventDefault();
    const line = input.value.trim();
    if (!line) return;
    try {
      const ask = line.match(/^@(\S+)\s+(.+)$/s);
      const set = line.match(/^([\w./-]+)=(.+)$/s);
      if (ask) await api("POST", `/environments/${envId}/ask`,
        {member: ask[1], text: ask[2]});
      else if (set) {
        let value; try { value = JSON.parse(set[2]); } catch { value = set[2]; }
        await api("POST", `/environments/${envId}/context`,
          {key: set[1], value});
      } else await api("POST", `/environments/${envId}/say`, {text: line});
      input.value = "";
      refresh();
    } catch (error) { alert(error.message); }
  });
  drawer.append(plumbing);
  drawer.addEventListener("toggle", () => {
    workingsOpen = drawer.open;
    if (drawer.open && !journal.dataset.filled) {
      journal.dataset.filled = "yes";
      fillJournal(journal);
    }
  });
  return drawer;
}

async function answerAsk(answerKey, value) {
  await api("POST", `/environments/${envId}/context`, {key: answerKey, value});
  await api("POST", `/environments/${envId}/build`);
  turnActive = true;
  turnStarted = Date.now();
  updateLiveness();
  refresh();
}

// The desk records a confirmed fill itself, at the moment of the click,
// from the exact receipt the member saw — the agent narrates afterward
// but never transcribes a fill. The answer carries the receipt clock it
// answered, so a confirmation is bound to one specific market.
async function answerFill(cardKey, check, option) {
  const cardId = cardKey.slice(8);            // widgets/…
  const answerKey = "answers/" + cardId;
  const suffix = cardId.slice(5);             // fill-…
  const isExit = suffix.endsWith("-exit");
  const caseId = isExit ? suffix.slice(0, -5) : suffix;
  const answer = {choice: option,
                  receipt_observed_at: check?.fill?.observed_at ?? null};
  try {
    if (option === "Confirm fill" && check?.verdict === "fill-supported") {
      const existing = lastView?.context?.[`cases/${caseId}`];
      if (!existing) {
        alert(`No case at cases/${caseId} — a fill needs its case first.`);
        return;
      }
      const fill = {...check.fill, confirmed: answerKey};
      const recorded = isExit
        ? {...existing, exit: fill, state: "closed"}
        : {...existing, fill, state: "open-simulated"};
      recorded.as_of = new Date().toISOString().slice(0, 19) + "+00:00";
      await api("POST", `/environments/${envId}/context`,
        {key: `cases/${caseId}`, value: recorded});
    }
    await api("POST", `/environments/${envId}/context`,
      {key: cardKey, value: null});           // retire the card
    await answerAsk(answerKey, answer);
  } catch (error) { alert(error.message); }
}

let building = false;
function renderIntake(view) {
  const questions = view.harness.questions || [];
  const section = document.getElementById("intake");
  const unanswered = questions.filter(
    q => !(("intake/" + q.key) in view.context));
  const hasCards = Object.keys(view.context).some(k => k.startsWith("widgets/"));
  if (!questions.length || (hasCards && !unanswered.length)) {
    section.hidden = true;
    return;
  }
  section.hidden = false;
  const form = document.getElementById("intake-form");
  if (form.dataset.rendered === "yes") return;
  form.dataset.rendered = "yes";
  form.style.flexDirection = "column";
  form.style.alignItems = "stretch";
  for (const q of questions) {
    const label = el("label", {style: "font-size:.85rem;opacity:.75;margin-top:.4rem"}, q.question);
    form.append(label);
    const existing = view.context["intake/" + q.key];
    if (q.kind === "range") {
      const row = el("div", {style: "display:flex;align-items:center;gap:.6rem"});
      const slider = el("input", {type: "range",
        min: q.min ?? 0, max: q.max ?? 100, step: q.step ?? 1,
        id: `q-${q.key}`, value: existing ?? q.default ?? q.min ?? 0});
      const readout = el("span", {class: "readout"});
      const show = () => readout.textContent =
        (q.unit || "") + Number(slider.value).toFixed(2);
      slider.addEventListener("input", show);
      show();
      row.append(slider, readout);
      form.append(row);
    } else if (q.kind === "choice") {
      const input = el("input", {type: "text", id: `q-${q.key}`,
        placeholder: q.placeholder || "", value: existing || ""});
      const row = el("div", {class: "choices"});
      const mark = () => { for (const b of row.children)
        b.classList.toggle("selected", b.textContent === input.value.trim()); };
      for (const option of q.options || []) {
        const pick = el("button", {type: "button"}, String(option));
        pick.addEventListener("click", () => { input.value = option; mark(); });
        row.append(pick);
      }
      input.addEventListener("input", mark);
      mark();
      form.append(row, input);
    } else {
      form.append(el("input", {type: "text", id: `q-${q.key}`,
        placeholder: q.placeholder || "", value: existing || ""}));
    }
  }
  const button = el("button", {style: "margin-top:.6rem"}, "Build the desk");
  form.append(button);
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (building) return;
    building = true;
    button.textContent = "The agent is building…";
    for (const q of questions) {
      const value = document.getElementById(`q-${q.key}`).value.trim();
      if (value) await api("POST", `/environments/${envId}/context`,
        {key: "intake/" + q.key, value});
    }
    await api("POST", `/environments/${envId}/build`);
    turnActive = true;
    turnStarted = Date.now();
    updateLiveness();
  });
}

function renderWidgets(view) {
  const section = el("section", {class: "full"});
  section.append(el("h2", {}, "Desk"));
  const deck = el("div", {id: "deck"});
  const cards = Object.entries(view.context)
    .filter(([key, value]) => key.startsWith("widgets/") && value)
    .sort(([, a], [, b]) => (b.pinned === true) - (a.pinned === true));
  if (!cards.length) deck.append(el("span", {class: "muted"},
    "No cards yet — any member can put one up."));
  for (const [key, spec] of cards) {
    const card = el("div", {class: "card"});
    if (spec.pinned === true) card.classList.add("pinned");
    if (["compact", "wide", "full"].includes(spec.size)) card.classList.add(spec.size);
    card.append(el("h3", {}, spec.title || key.slice(8)));
    if (spec.kind === "metric") {
      card.append(el("div", {class: "metric"}, String(spec.value ?? "—")));
      if (spec.label) card.append(el("div", {class: "metric-label"}, spec.label));
      if (spec.detail) card.append(el("p", {}, spec.detail));
    } else if (spec.kind === "table") {
      const table = el("table");
      if (spec.columns) {
        const head = el("tr");
        for (const column of spec.columns) head.append(el("td", {class: "key"}, column));
        table.append(head);
      }
      for (const row of spec.rows || []) {
        const line = el("tr");
        for (const cell of row) line.append(el("td", {}, String(cell)));
        table.append(line);
      }
      card.append(table);
    } else if (spec.kind === "text") {
      // A refresh program may park an object in body; show it honestly
      // as formatted data rather than "[object Object]".
      if (spec.body !== null && typeof spec.body === "object") {
        const pre = el("pre", {class: "data-body"},
          JSON.stringify(spec.body, null, 1).slice(0, 2000));
        card.append(pre);
      } else {
        card.append(el("p", {}, spec.body || ""));
      }
    } else if (spec.kind === "ask") {
      card.style.borderColor = "color-mix(in srgb, CanvasText 45%, transparent)";
      // A fill confirmation (widgets/fill-*) is program-backed: its question
      // and options come from the fill_check receipt the card's own refresh
      // wrote into spec.check. No supported receipt, no answer controls —
      // a hand-composed fill card can never collect a confirmation here.
      const isFill = key.startsWith("widgets/fill-");
      const check = isFill ? spec.check : null;
      const supported = !!(check && check.verdict === "fill-supported" && check.ask_card);
      const question = isFill && supported
        ? check.ask_card.question : (spec.question || "");
      const options = isFill && supported ? check.ask_card.options : spec.options;
      card.append(el("p", {}, question));
      const answerKey = "answers/" + key.slice(8);
      const already = view.context[answerKey];
      if (already !== undefined) {
        card.append(el("p", {class: "muted"}, `you answered: ${JSON.stringify(already)}`));
      } else if (isFill && !supported) {
        card.append(el("p", {class: "violation"},
          "⚠ no live receipted market — no confirmation offered"));
        for (const reason of check?.reasons || [])
          card.append(el("p", {class: "violation"}, String(reason)));
      } else if (Array.isArray(options) && options.length) {
        const row = el("div", {style: "display:flex;gap:.4rem;flex-wrap:wrap"});
        for (const option of options) {
          const pick = el("button", {}, String(option));
          pick.addEventListener("click", () => isFill
            ? answerFill(key, check, option)
            : answerAsk(answerKey, option));
          row.append(pick);
        }
        card.append(row);
      } else if (!isFill) {
        const form = el("form");
        const input = el("input", {type: "text", placeholder: "your answer…"});
        form.append(input, el("button", {}, "Answer"));
        form.addEventListener("submit", e => {
          e.preventDefault();
          if (input.value.trim()) answerAsk(answerKey, input.value.trim());
        });
        card.append(form);
      }
    } else if (["line", "bar", "candle", "scatter", "ladder", "flow", "treemap",
                "relative_range", "connected_scatter", "streamgraph"]
               .includes(spec.kind)) {
      card.classList.add("chart");
      // Charts read best at full width; an explicit size still wins.
      if (!["compact", "standard", "wide", "full"].includes(spec.size))
        card.classList.add("full");
      // Shorthand: {"kind":"candle","chart":{"symbol":"NVDA","days":60}} —
      // the desk fetches and refreshes the data itself; agents write facts.
      if (spec.chart?.symbol && !spec.candles && !spec.series && !spec.bars) {
        const holder = el("div");
        holder.append(el("p", {class: "muted"}, `loading ${spec.chart.symbol}…`));
        card.append(holder);
        toolData("daily_bars",
          {symbol: spec.chart.symbol, days: spec.chart.days || 60}, 30)
          .then(receipt => {
            if (!receipt?.ok) {
              holder.replaceChildren(el("p", {class: "violation"},
                `⚠ ${receipt?.summary || "data fetch failed"} — chart unavailable`));
              return;
            }
            const filled = spec.kind === "line"
              ? {...spec, series: [{name: receipt.data.symbol,
                                    points: receipt.data.points}]}
              : {...spec, kind: "candle", candles: receipt.data.candles};
            holder.replaceChildren(renderChart(filled),
              el("div", {class: "as-of"},
                `as of ${receipt.as_of}${(receipt.gaps || []).length
                  ? " · " + receipt.gaps[0] : ""}`));
          });
      } else {
        card.append(renderChart(spec));
      }
    } else {
      card.append(el("p", {class: "muted"}, `[${spec.kind}] not rendered yet`));
    }
    if (spec.refresh_error)
      card.append(el("p", {class: "violation"}, `⚠ refresh failed: ${spec.refresh_error}`));
    if (spec.as_of) card.append(el("div", {class: "as-of"}, `as of ${spec.as_of}`));
    deck.append(card);
  }
  section.append(deck);
  return section;
}

// One rulebook: the engine's case_check is the only implementation of the
// case contract. The client caches verdicts per exact case value and renders
// them; it adds only the checks the engine cannot see from a tool call —
// whether the referenced answer entry actually exists on this desk.
const caseVerdicts = new Map();
const caseChecksPending = new Set();
function engineViolations(key, spec) {
  const fingerprint = key + "|" + JSON.stringify(spec);
  if (caseVerdicts.has(fingerprint)) return caseVerdicts.get(fingerprint);
  if (!caseChecksPending.has(fingerprint)) {
    caseChecksPending.add(fingerprint);
    api("POST", `/environments/${envId}/tools/case_check`,
        {args: {case: spec, id: key.slice(6)}})
      .then(reply => caseVerdicts.set(fingerprint,
        reply.result?.data?.violations ?? reply.result?.gaps ?? []))
      .catch(error => caseVerdicts.set(fingerprint,
        [`case_check did not answer: ${error.message}`]))
      .finally(() => {
        caseChecksPending.delete(fingerprint);
        lastRendered = "";
        if (lastView) render(lastView);
      });
  }
  return null; // verdict pending
}

function answerProblems(spec, context) {
  const problems = [];
  for (const [label, f] of [["fill", spec?.fill], ["exit", spec?.exit]]) {
    if (!f || !f.confirmed) continue;
    if (!(f.confirmed in context)) {
      problems.push(`UNCONFIRMED — ${f.confirmed} not found on this desk`);
      continue;
    }
    const answer = context[f.confirmed];
    const choice = answer && typeof answer === "object" ? answer.choice : answer;
    if (String(choice) !== "Confirm fill")
      problems.push(`the answer at ${f.confirmed} does not read "Confirm fill"`);
    else if (answer && typeof answer === "object" &&
             answer.receipt_observed_at &&
             answer.receipt_observed_at !== f.observed_at)
      problems.push(`the ${label}'s clock does not match the receipt the ` +
        `member confirmed (${answer.receipt_observed_at})`);
  }
  return problems;
}

function renderCases(view) {
  const section = el("section", {class: "full"});
  section.append(el("h2", {}, "Cases"));
  const grid = el("div", {id: "cases"});
  const order = {"open-simulated": 0, "watching": 1, "idea": 2, "closed": 3};
  const entries = Object.entries(view.context)
    .filter(([key, value]) => key.startsWith("cases/") && value)
    .sort(([a], [b]) => a.localeCompare(b))
    .sort(([, a], [, b]) => (order[a?.state] ?? 4) - (order[b?.state] ?? 4));
  for (const [key, spec] of entries) {
    const card = el("div", {class: "card"});
    const head = el("div", {class: "case-head"});
    head.append(el("h3", {}, (spec && spec.contract) || key.slice(6)));
    head.append(el("span", {class: `state s-${spec?.state}`},
      String(spec?.state ?? "?")));
    card.append(head);
    if (spec?.thesis) card.append(el("p", {}, spec.thesis));
    if (spec?.invalidation)
      card.append(el("p", {class: "invalidation"}, `Wrong if: ${spec.invalidation}`));
    for (const [label, f] of [["fill", spec?.fill], ["exit", spec?.exit]]) {
      if (!f) continue;
      const confirmed = f.confirmed && view.context[f.confirmed] === "Confirm fill";
      card.append(el("p", {class: "fill-line"},
        `${label}: ${f.quantity} @ $${f.price} · market ${f.bid} × ${f.ask}` +
        ` · ${f.observed_at}${confirmed ? " · confirmed ✓" : ""}`));
    }
    if (Array.isArray(spec?.evidence) && spec.evidence.length)
      card.append(el("p", {class: "muted"}, `evidence: ${spec.evidence.join(" · ")}`));
    if (spec?.as_of) card.append(el("div", {class: "as-of"}, `as of ${spec.as_of}`));
    const engine = engineViolations(key, spec);
    if (engine === null) {
      card.append(el("p", {class: "muted"}, "checking the case contract…"));
    } else {
      for (const problem of [...engine, ...answerProblems(spec, view.context)])
        card.append(el("p", {class: "violation"}, `⚠ ${problem}`));
    }
    grid.append(card);
  }
  section.append(grid);
  return section;
}

function renderChart(spec) {
  if (typeof d3 === "undefined")
    return el("p", {class: "violation"}, "⚠ chart library not loaded — the chart cannot render");
  const tall = ["ladder", "treemap", "flow", "candle",
                "relative_range", "streamgraph"].includes(spec.kind);
  const width = 860, height = tall ? 360 : 300;
  const margin = {top: 24, bottom: 34,
    right: ["scatter", "ladder", "flow", "treemap", "bar"].includes(spec.kind) ? 14 : 56,
    left: spec.kind === "ladder" ? 86 : 46};
  const svg = d3.create("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const inner = {w: width - margin.left - margin.right,
                 h: height - margin.top - margin.bottom};
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
  const axisColor = "color-mix(in srgb, CanvasText 55%, transparent)";
  const gridColor = "color-mix(in srgb, CanvasText 12%, transparent)";
  const palette = ["#4f8ef7", "#f2a43a", "#4fb98a", "#d96a6a", "#9a7bd6", "#5ec4d6"];
  const up = "#4fb98a", down = "#d96a6a";
  const fmt = v => Math.abs(+v) >= 1000 ? d3.format(",.0f")(+v) : d3.format(".2f")(+v);

  function styleAxis(selection) {
    selection.selectAll("path,line").attr("stroke", axisColor);
    selection.selectAll("text").attr("fill", axisColor).attr("font-size", "10px");
  }

  // Crosshair + readout: hover anywhere on the plot, read the nearest datum.
  function hover(items, xOf, textOf) {
    if (!items.length) return;
    const cross = g.append("line").attr("y1", 0).attr("y2", inner.h)
      .attr("stroke", axisColor).attr("stroke-dasharray", "3,3")
      .style("display", "none");
    const readout = g.append("text").attr("x", inner.w).attr("y", -8)
      .attr("text-anchor", "end").attr("fill", "CanvasText")
      .attr("font-size", "11px").style("display", "none");
    svg.append("rect")
      .attr("x", margin.left).attr("y", margin.top)
      .attr("width", inner.w).attr("height", inner.h)
      .attr("fill", "transparent")
      .on("pointermove", event => {
        const [px] = d3.pointer(event, g.node());
        let best = null, gap = Infinity;
        for (const item of items) {
          const distance = Math.abs(xOf(item) - px);
          if (distance < gap) { gap = distance; best = item; }
        }
        if (best === null) return;
        cross.style("display", null).attr("x1", xOf(best)).attr("x2", xOf(best));
        readout.style("display", null).text(textOf(best));
      })
      .on("pointerleave", () => {
        cross.style("display", "none");
        readout.style("display", "none");
      });
  }

  if (spec.kind === "candle") {
    const candles = (spec.candles || []).map(([date, open, high, low, close]) =>
      ({date, open: +open, high: +high, low: +low, close: +close}));
    const x = d3.scaleBand().domain(candles.map(c => c.date))
      .range([0, inner.w]).padding(0.35);
    const y = d3.scaleLinear()
      .domain([d3.min(candles, c => c.low), d3.max(candles, c => c.high)]).nice()
      .range([inner.h, 0]);
    g.append("g").call(d3.axisLeft(y).ticks(6).tickSize(-inner.w))
      .call(styleAxis).selectAll("line").attr("stroke", gridColor);
    const ticks = x.domain().filter((_, i, all) => i % Math.ceil(all.length / 9) === 0);
    g.append("g").attr("transform", `translate(0,${inner.h})`)
      .call(d3.axisBottom(x).tickValues(ticks).tickSize(0)).call(styleAxis);
    // Supply/demand zone overlays (ported from the old desk): translucent
    // bands behind the candles, labeled at the left edge.
    for (const zone of (spec.zones || []).slice(0, 16)) {
      const upper = +zone.upper, lower = +zone.lower;
      if (!isFinite(upper) || !isFinite(lower) || upper < lower) continue;
      const color = zone.zone_type === "supply" ? down : up;
      g.append("rect")
        .attr("x", 0).attr("width", inner.w)
        .attr("y", y(Math.min(upper, y.domain()[1])))
        .attr("height", Math.max(2,
          y(Math.max(lower, y.domain()[0])) - y(Math.min(upper, y.domain()[1]))))
        .attr("fill", color).attr("fill-opacity", 0.10);
      g.append("line")
        .attr("x1", 0).attr("x2", inner.w)
        .attr("y1", y(upper)).attr("y2", y(upper))
        .attr("stroke", color).attr("stroke-opacity", 0.35)
        .attr("stroke-dasharray", "2,3");
      g.append("text").attr("x", 4).attr("y", y(upper) + 11)
        .attr("fill", color).attr("font-size", "9px").attr("font-weight", "600")
        .text(`${zone.label || zone.zone_type} ${fmt(lower)}–${fmt(upper)}`);
    }
    const stick = g.selectAll("g.candle").data(candles).join("g");
    stick.append("line")
      .attr("x1", c => x(c.date) + x.bandwidth() / 2)
      .attr("x2", c => x(c.date) + x.bandwidth() / 2)
      .attr("y1", c => y(c.high)).attr("y2", c => y(c.low))
      .attr("stroke", c => c.close >= c.open ? up : down);
    stick.append("rect")
      .attr("x", c => x(c.date))
      .attr("width", x.bandwidth())
      .attr("y", c => y(Math.max(c.open, c.close)))
      .attr("height", c => Math.max(1, Math.abs(y(c.open) - y(c.close))))
      .attr("rx", 1)
      .attr("fill", c => c.close >= c.open ? up : down);
    const last = candles[candles.length - 1];
    if (last) {
      g.append("line").attr("x1", 0).attr("x2", inner.w)
        .attr("y1", y(last.close)).attr("y2", y(last.close))
        .attr("stroke", last.close >= last.open ? up : down)
        .attr("stroke-dasharray", "4,3").attr("stroke-opacity", 0.7);
      g.append("text").attr("x", inner.w + 4).attr("y", y(last.close) + 3)
        .attr("fill", last.close >= last.open ? up : down)
        .attr("font-size", "11px").attr("font-weight", "600")
        .text(fmt(last.close));
    }
    hover(candles, c => x(c.date) + x.bandwidth() / 2,
      c => `${c.date}   O ${fmt(c.open)}  H ${fmt(c.high)}  L ${fmt(c.low)}  C ${fmt(c.close)}`);
  } else if (spec.kind === "scatter") {
    const points = (spec.points || []).map(p =>
      ({x: +p.x, y: +p.y, label: p.label, size: +p.size || 4}));
    const x = d3.scaleLinear().domain(d3.extent(points, p => p.x)).nice()
      .range([0, inner.w]);
    const y = d3.scaleLinear().domain(d3.extent(points, p => p.y)).nice()
      .range([inner.h, 0]);
    g.append("g").call(d3.axisLeft(y).ticks(4).tickSize(-inner.w))
      .call(styleAxis).selectAll("line").attr("stroke", gridColor);
    g.append("g").attr("transform", `translate(0,${inner.h})`)
      .call(d3.axisBottom(x).ticks(5).tickSize(0)).call(styleAxis);
    const dot = g.selectAll("g.dot").data(points).join("g");
    dot.append("circle")
      .attr("cx", p => x(p.x)).attr("cy", p => y(p.y))
      .attr("r", p => Math.min(14, p.size))
      .attr("fill", palette[0]).attr("fill-opacity", 0.55)
      .attr("stroke", palette[0]);
    dot.filter(p => p.label).append("text")
      .attr("x", p => x(p.x) + 8).attr("y", p => y(p.y) - 6)
      .attr("fill", axisColor).attr("font-size", "10px")
      .text(p => p.label);
  } else if (spec.kind === "ladder") {
    const rungs = (spec.rungs || []).map(r => ({label: String(r.label), value: +r.value}));
    const y = d3.scaleBand().domain(rungs.map(r => r.label))
      .range([0, inner.h]).padding(0.3);
    const extent = [Math.min(0, d3.min(rungs, r => r.value)),
                    Math.max(0, d3.max(rungs, r => r.value))];
    const x = d3.scaleLinear().domain(extent).nice().range([0, inner.w]);
    g.append("g").call(d3.axisLeft(y).tickSize(0)).call(styleAxis);
    g.append("line").attr("x1", x(0)).attr("x2", x(0))
      .attr("y1", 0).attr("y2", inner.h).attr("stroke", axisColor);
    g.selectAll("rect").data(rungs).join("rect")
      .attr("y", r => y(r.label)).attr("height", y.bandwidth())
      .attr("x", r => Math.min(x(0), x(r.value)))
      .attr("width", r => Math.max(1, Math.abs(x(r.value) - x(0))))
      .attr("rx", 2)
      .attr("fill", r => r.value < 0 ? down : up);
    g.selectAll("text.value").data(rungs).join("text")
      .attr("x", r => x(r.value) + (r.value < 0 ? -4 : 4))
      .attr("y", r => y(r.label) + y.bandwidth() / 2 + 3)
      .attr("text-anchor", r => r.value < 0 ? "end" : "start")
      .attr("fill", axisColor).attr("font-size", "9px")
      .text(r => r.value);
  } else if (spec.kind === "relative_range") {
    // Percent distance from one reference (ported from the old desk):
    // strikes vs spot, zones vs the last close — anything measured from here.
    const reference = +spec.reference?.value;
    const rows = (spec.rows || [])
      .map(r => ({label: String(r.label), value: +r.value}))
      .filter(r => isFinite(r.value) && isFinite(reference) && reference > 0)
      .map(r => ({label: r.label, pct: 100 * (r.value - reference) / reference}));
    const y = d3.scaleBand().domain(rows.map(r => r.label))
      .range([0, inner.h]).padding(0.3);
    const spread = Math.max(1, d3.max(rows, r => Math.abs(r.pct)) || 1);
    const x = d3.scaleLinear().domain([-spread, spread]).nice().range([0, inner.w]);
    g.append("g").call(d3.axisLeft(y).tickSize(0)).call(styleAxis);
    g.append("g").attr("transform", `translate(0,${inner.h})`)
      .call(d3.axisBottom(x).ticks(6).tickFormat(v => `${v > 0 ? "+" : ""}${v}%`)
        .tickSize(-inner.h)).call(styleAxis)
      .selectAll("line").attr("stroke", gridColor);
    g.append("line").attr("x1", x(0)).attr("x2", x(0))
      .attr("y1", 0).attr("y2", inner.h).attr("stroke", axisColor);
    g.append("text").attr("x", x(0) + 4).attr("y", -8)
      .attr("fill", axisColor).attr("font-size", "10px")
      .text(`${spec.reference?.label || "reference"} ${fmt(reference)}`);
    g.selectAll("rect.rr").data(rows).join("rect")
      .attr("y", r => y(r.label)).attr("height", y.bandwidth())
      .attr("x", r => Math.min(x(0), x(r.pct)))
      .attr("width", r => Math.max(1, Math.abs(x(r.pct) - x(0))))
      .attr("rx", 2)
      .attr("fill", r => r.pct < 0 ? down : up).attr("fill-opacity", 0.75);
    g.selectAll("text.rr").data(rows).join("text")
      .attr("x", r => x(r.pct) + (r.pct < 0 ? -4 : 4))
      .attr("y", r => y(r.label) + y.bandwidth() / 2 + 3)
      .attr("text-anchor", r => r.pct < 0 ? "end" : "start")
      .attr("fill", axisColor).attr("font-size", "9px")
      .text(r => `${r.pct > 0 ? "+" : ""}${r.pct.toFixed(1)}%`);
  } else if (spec.kind === "connected_scatter") {
    // A path through x/y over time: volume vs premium, IV vs price.
    const points = (spec.points || []).map(p =>
      ({x: +p.x, y: +p.y, label: p.label}));
    const x = d3.scaleLinear().domain(d3.extent(points, p => p.x)).nice()
      .range([0, inner.w]);
    const y = d3.scaleLinear().domain(d3.extent(points, p => p.y)).nice()
      .range([inner.h, 0]);
    g.append("g").call(d3.axisLeft(y).ticks(5).tickSize(-inner.w))
      .call(styleAxis).selectAll("line").attr("stroke", gridColor);
    g.append("g").attr("transform", `translate(0,${inner.h})`)
      .call(d3.axisBottom(x).ticks(6).tickSize(0)).call(styleAxis);
    g.append("path").datum(points)
      .attr("fill", "none").attr("stroke", palette[0])
      .attr("stroke-width", 1.6).attr("stroke-opacity", 0.6)
      .attr("d", d3.line().x(p => x(p.x)).y(p => y(p.y)));
    const dot = g.selectAll("g.cs").data(points).join("g");
    dot.append("circle")
      .attr("cx", p => x(p.x)).attr("cy", p => y(p.y))
      .attr("r", (p, i) => i === points.length - 1 ? 5 : 3)
      .attr("fill", (p, i) => i === points.length - 1 ? palette[1] : palette[0]);
    dot.filter(p => p.label).append("text")
      .attr("x", p => x(p.x) + 7).attr("y", p => y(p.y) - 5)
      .attr("fill", axisColor).attr("font-size", "9px").text(p => p.label);
  } else if (spec.kind === "streamgraph") {
    // Composition over time: share of volume, attention, premium by name.
    const series = (spec.series || []).map(s => ({
      name: String(s.name || ""), points: new Map(
        (s.points || []).map(([px, py]) => [String(px), +py || 0])),
    }));
    // Union of x values in author order — labels like "Aug 10" must not
    // be resorted lexicographically.
    const xValues = [];
    for (const s of series)
      for (const key of s.points.keys())
        if (!xValues.includes(key)) xValues.push(key);
    const rows = xValues.map(v =>
      Object.fromEntries([["__x", v],
        ...series.map(s => [s.name, s.points.get(v) ?? 0])]));
    const stacked = d3.stack().keys(series.map(s => s.name))
      .offset(d3.stackOffsetWiggle).order(d3.stackOrderInsideOut)(rows);
    const x = d3.scalePoint().domain(xValues).range([0, inner.w]);
    const y = d3.scaleLinear()
      .domain([d3.min(stacked.flat(), d => d[0]), d3.max(stacked.flat(), d => d[1])])
      .nice().range([inner.h, 0]);
    const ticks = xValues.filter((_, i, all) => i % Math.ceil(all.length / 7) === 0);
    g.append("g").attr("transform", `translate(0,${inner.h})`)
      .call(d3.axisBottom(x).tickValues(ticks).tickSize(0)).call(styleAxis);
    g.selectAll("path.stream").data(stacked).join("path")
      .attr("fill", (d, i) => palette[i % palette.length])
      .attr("fill-opacity", 0.8)
      .attr("d", d3.area()
        .x(d => x(d.data.__x)).y0(d => y(d[0])).y1(d => y(d[1]))
        .curve(d3.curveCatmullRom));
    const legend = g.append("g").attr("font-size", "10px");
    series.forEach((s, index) => {
      const item = legend.append("g")
        .attr("transform", `translate(${index * 96}, -8)`);
      item.append("rect").attr("width", 8).attr("height", 8)
        .attr("y", -8).attr("fill", palette[index % palette.length]);
      item.append("text").attr("x", 12).attr("fill", axisColor)
        .text(s.name || `series ${index + 1}`);
    });
  } else if (spec.kind === "flow") {
    const graph = d3.sankey()
      .nodeWidth(10).nodePadding(14)
      .extent([[0, 0], [inner.w, inner.h]])({
        nodes: (spec.nodes || []).map(name => ({name})),
        links: (spec.links || []).map(([source, target, value]) =>
          ({source, target, value: +value})),
      });
    g.selectAll("path").data(graph.links).join("path")
      .attr("d", d3.sankeyLinkHorizontal())
      .attr("fill", "none").attr("stroke", palette[0])
      .attr("stroke-opacity", 0.35)
      .attr("stroke-width", l => Math.max(1, l.width));
    const node = g.selectAll("g.node").data(graph.nodes).join("g");
    node.append("rect")
      .attr("x", n => n.x0).attr("y", n => n.y0)
      .attr("width", n => n.x1 - n.x0).attr("height", n => Math.max(1, n.y1 - n.y0))
      .attr("fill", (n, i) => palette[i % palette.length]).attr("rx", 2);
    node.append("text")
      .attr("x", n => n.x0 < inner.w / 2 ? n.x1 + 5 : n.x0 - 5)
      .attr("y", n => (n.y0 + n.y1) / 2 + 3)
      .attr("text-anchor", n => n.x0 < inner.w / 2 ? "start" : "end")
      .attr("fill", axisColor).attr("font-size", "10px")
      .text(n => `${n.name} (${n.value})`);
  } else if (spec.kind === "treemap") {
    const leaves = (spec.leaves || []).map(l =>
      ({label: String(l.label), value: Math.abs(+l.value) || 1, raw: +l.value}));
    const root = d3.treemap().size([inner.w, inner.h]).padding(3)(
      d3.hierarchy({children: leaves}).sum(l => l.value));
    const cell = g.selectAll("g.cell").data(root.leaves()).join("g")
      .attr("transform", n => `translate(${n.x0},${n.y0})`);
    cell.append("rect")
      .attr("width", n => n.x1 - n.x0).attr("height", n => n.y1 - n.y0)
      .attr("rx", 3)
      .attr("fill", n => (n.data.raw ?? 0) < 0 ? down : up)
      .attr("fill-opacity", 0.7);
    cell.append("text")
      .attr("x", 6).attr("y", 16)
      .attr("fill", "Canvas").attr("font-size", "11px").attr("font-weight", "600")
      .text(n => n.data.label);
    cell.append("text")
      .attr("x", 6).attr("y", 30)
      .attr("fill", "Canvas").attr("font-size", "10px")
      .text(n => n.data.raw);
  } else if (spec.kind === "bar") {
    const bars = spec.bars || [];
    const x = d3.scaleBand().domain(bars.map(b => String(b.label)))
      .range([0, inner.w]).padding(0.25);
    const extent = [Math.min(0, d3.min(bars, b => +b.value) || 0),
                    Math.max(0, d3.max(bars, b => +b.value) || 0)];
    const y = d3.scaleLinear().domain(extent).nice().range([inner.h, 0]);
    g.append("g").call(d3.axisLeft(y).ticks(4).tickSize(-inner.w))
      .call(styleAxis).selectAll("line").attr("stroke", gridColor);
    const ticks = x.domain().filter((_, i, all) =>
      i % Math.ceil(all.length / 8) === 0);
    g.append("g").attr("transform", `translate(0,${y(0)})`)
      .call(d3.axisBottom(x).tickValues(ticks).tickSize(0)).call(styleAxis);
    g.selectAll("rect").data(bars).join("rect")
      .attr("x", b => x(String(b.label)))
      .attr("width", x.bandwidth())
      .attr("y", b => Math.min(y(0), y(+b.value)))
      .attr("height", b => Math.abs(y(+b.value) - y(0)))
      .attr("rx", 2)
      .attr("fill", (b, i) => +b.value < 0 ? palette[3] : palette[0]);
    hover(bars, b => x(String(b.label)) + x.bandwidth() / 2,
      b => `${b.label}   ${fmt(b.value)}`);
  } else {
    const series = (spec.series || []).map(s => ({
      name: s.name,
      points: (s.points || []).map(([px, py]) => [
        typeof px === "string" ? new Date(px) : +px, +py]),
    }));
    const all = series.flatMap(s => s.points);
    const isTime = all.length && all[0][0] instanceof Date;
    const x = (isTime ? d3.scaleTime() : d3.scaleLinear())
      .domain(d3.extent(all, p => p[0])).range([0, inner.w]);
    const y = d3.scaleLinear().domain(d3.extent(all, p => p[1])).nice()
      .range([inner.h, 0]);
    g.append("g").call(d3.axisLeft(y).ticks(6).tickSize(-inner.w))
      .call(styleAxis).selectAll("line").attr("stroke", gridColor);
    g.append("g").attr("transform", `translate(0,${inner.h})`)
      .call(d3.axisBottom(x).ticks(7).tickSize(0)).call(styleAxis);
    if (series.length === 1 && series[0].points.length) {
      const gradientId = `grad-${Math.abs(d3.sum(series[0].points, p => +p[1])).toString(36).replace(".", "")}`;
      const gradient = svg.append("defs").append("linearGradient")
        .attr("id", gradientId)
        .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 1);
      gradient.append("stop").attr("offset", "0%")
        .attr("stop-color", palette[0]).attr("stop-opacity", 0.22);
      gradient.append("stop").attr("offset", "100%")
        .attr("stop-color", palette[0]).attr("stop-opacity", 0);
      g.append("path").datum(series[0].points)
        .attr("fill", `url(#${gradientId})`)
        .attr("d", d3.area().x(p => x(p[0])).y0(inner.h).y1(p => y(p[1])));
    }
    const line = d3.line().x(p => x(p[0])).y(p => y(p[1]));
    for (const [index, s] of series.entries()) {
      const color = palette[index % palette.length];
      g.append("path").datum(s.points)
        .attr("fill", "none").attr("stroke", color)
        .attr("stroke-width", 2).attr("d", line);
      const last = s.points[s.points.length - 1];
      if (last) {
        g.append("circle").attr("cx", x(last[0])).attr("cy", y(last[1]))
          .attr("r", 3).attr("fill", color);
        g.append("text").attr("x", x(last[0]) + 6).attr("y", y(last[1]) + 3)
          .attr("fill", color).attr("font-size", "11px")
          .attr("font-weight", "600").text(fmt(last[1]));
      }
    }
    const label = p => isTime ? p[0].toISOString().slice(0, 10) : String(p[0]);
    const named = series.flatMap(s =>
      s.points.map(p => ({p, name: s.name})));
    hover(named, item => x(item.p[0]), item =>
      `${label(item.p)}   ${item.name ? item.name + " " : ""}${fmt(item.p[1])}`);
    if (series.length > 1) {
      const legend = g.append("g").attr("font-size", "10px");
      series.forEach((s, index) => {
        const item = legend.append("g")
          .attr("transform", `translate(${index * 90}, -4)`);
        item.append("rect").attr("width", 8).attr("height", 8)
          .attr("y", -8).attr("fill", palette[index % palette.length]);
        item.append("text").attr("x", 12).attr("fill", axisColor)
          .text(s.name || `series ${index + 1}`);
      });
    }
  }
  if (spec.y_label) svg.append("text")
    .attr("transform", "rotate(-90)").attr("x", -height / 2).attr("y", 12)
    .attr("text-anchor", "middle").attr("fill", axisColor)
    .attr("font-size", "10px").text(spec.y_label);
  return svg.node();
}

function renderBoard(view) {
  const section = el("section");
  section.append(el("h2", {}, "Context"));
  const table = el("table");
  const entries = Object.entries(view.context)
    .filter(([key]) => !key.startsWith("widgets/") && !key.startsWith("cases/"));
  if (!entries.length) table.append(el("tr", {}).appendChild(el("td", {class: "muted"}, "empty")).parentNode);
  for (const [key, value] of entries) {
    const row = el("tr");
    row.append(el("td", {class: "key"}, key));
    row.append(el("td", {class: "val"}, JSON.stringify(value)));
    table.append(row);
  }
  section.append(table);
  return section;
}

async function fillJournal(section) {
  const items = await api("GET", `/environments/${envId}/journal`);
  const feed = el("div", {style: "max-height:40vh;overflow-y:auto;font-size:.82rem;"});
  for (const item of items) {
    const when = new Date(item.timestamp_us / 1000).toLocaleTimeString();
    const line = el("div", {class: "muted"});
    line.append(el("b", {}, item.author + " "));
    line.append(document.createTextNode(`${item.key} — ${item.summary}  ·  ${when}`));
    feed.append(line);
  }
  section.append(feed);
}

function renderConversation(view) {
  const section = el("section");
  section.append(el("h2", {}, "Conversation"));
  const feed = el("div", {id: "feed"});
  for (const item of view.conversation) {
    const line = el("div", {class: item.kind === "instruction" ? "msg task" : "msg"});
    const name = el("b", {}, item.name);
    line.append(name);
    if (item.kind === "instruction") {
      const target = item.to === you ? "you" : item.to_name;
      line.append(document.createTextNode(`asks ${target}: ${item.text}`));
    } else {
      line.append(document.createTextNode(item.text));
    }
    feed.append(line);
  }
  section.append(feed);
  queueMicrotask(() => feed.scrollTop = feed.scrollHeight);
  return section;
}

async function refresh() {
  const view = await api("GET", `/environments/${envId}?token=${token}`);
  lastFetchAt = Date.now();
  render(view);
}

document.getElementById("composer").addEventListener("submit", async event => {
  event.preventDefault();
  const box = document.getElementById("line");
  const line = box.value.trim();
  if (!line) return;
  try {
    await api("POST", `/environments/${envId}/say`, {text: line});
    await api("POST", `/environments/${envId}/build`);
    turnActive = true;
    turnStarted = Date.now();
    updateLiveness();
    box.value = "";
    refresh();
  } catch (error) { alert(error.message); }
});

assetsReady.catch(error => console.error(error)).then(refresh);
const stream = new EventSource(`/environments/${envId}/events?token=${token}`);
stream.onmessage = () => refresh();
setInterval(refresh, 5000);
</script>
